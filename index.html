<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>竞彩盘口分析台</title><style>body{margin:0;background:#0b1220;color:#eef4fb;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:22px;background:#14283a}main{max-width:850px;margin:auto;padding:14px}section{background:#121d2e;border:1px solid #2b3b52;border-radius:12px;padding:15px;margin:12px 0}h1{font-size:23px;margin:0}h2{font-size:18px}label{display:block;color:#9eafc4;font-size:13px;margin-top:10px}input,select,textarea{width:100%;box-sizing:border-box;background:#0d1726;color:white;border:1px solid #2b3b52;border-radius:8px;padding:10px;font:inherit}textarea{min-height:70px}button{background:#59d6b3;border:0;border-radius:8px;padding:10px 14px;margin:10px 6px 0 0;font-weight:bold}small{color:#9eafc4}.item{border-top:1px solid #2b3b52;padding:12px 0}.warn{background:#29251d;padding:10px;color:#f2d8a8;border-radius:6px;font-size:13px}</style><header><h1>⚽ 竞彩盘口分析台</h1><small>赛前留档 · 盘口核验 · 赛后复盘</small></header><main><section><div class="warn">严格遵循：只记录捷报比分原始盘口，不使用“推荐”。本页面暂不自动抓取捷报，未核验的数据不要当作事实。</div><h2>新增比赛 / 赛后复盘</h2><form id="f"><label>竞彩编号</label><input id="n" placeholder="001"><label>开赛时间</label><input id="d" type="datetime-local"><label>赛事</label><input id="l"><label>主队</label><input id="h" required><label>客队</label><input id="a" required><label>核验状态</label><select id="v"><option>未核验</option><option>已核验</option><option>部分缺失</option></select><label>亚盘初盘</label><input id="ao"><label>亚盘即时盘</label><input id="an"><label>水位变化</label><input id="w"><label>欧赔（主/平/客）</label><input id="e"><label>凯利（主/平/客）</label><input id="k"><label>大小球盘口 / 水位</label><input id="o"><label>赛前胜平负预测</label><select id="p"><option value="">未判断</option><option>胜</option><option>平</option><option>负</option></select><label>让球胜平负预测</label><input id="hp"><label>半全场预测</label><input id="ht"><label>比分预测</label><input id="sp"><label>赛前理由 / 历史样本 / 风险</label><textarea id="r"></textarea><label>实际比分</label><input id="as"><label>实际胜平负</label><select id="ar"><option value="">未出赛果</option><option>胜</option><option>平</option><option>负</option></select><label>赛后复盘</label><textarea id="rv"></textarea><button type="submit">保存比赛</button><button type="button" id="ex">导出备份</button><button type="button" id="im">导入备份</button><input type="file" id="file" accept=".json" hidden></form></section><section><h2>历史记录</h2><div id="stats"></div><div id="list"></div></section><section><h2>使用规则</h2><ol><li>先核对捷报竞彩编号、球队和开赛时间。</li><li>记录亚盘初盘、即时盘、水位变化、欧赔；有数据时记录凯利、大小球与历史盘口。</li><li>数据缺失要明确标注，不拿其他网站赔率替代，不参考捷报推荐。</li><li>赛前预测保存后，赛后只补充赛果和复盘，不得改写原始判断。</li></ol><small>当前版本将数据保存在本设备浏览器。清除浏览器数据可能丢失，请定期导出备份。不会自动抓取捷报或跨设备同步。</small></section></main><script>const $=x=>document.getElementById(x),fields=['n','d','l','h','a','v','ao','an','w','e','k','o','p','hp','ht','sp','r','as','ar','rv'];let data=[];try{data=JSON.parse(localStorage.getItem('jc_records')||'[]')}catch(e){}function save(){localStorage.setItem('jc_records',JSON.stringify(data));render()}function render(){let done=data.filter(x=>x.ar),valid=done.filter(x=>x.p);$('stats').textContent='共 '+data.length+' 场；已复盘 '+done.length+' 场；胜平负命中率 '+(valid.length?Math.round(valid.filter(x=>x.p===x.ar).length/valid.length*100)+'%':'暂无');$('list').innerHTML=data.slice().reverse().map((x,i)=>'<div class="item"><b>'+x.n+'　'+x.h+' vs '+x.a+'</b><p><small>核验：'+x.v+'｜亚盘：'+(x.ao||'—')+' → '+(x.an||'—')+'｜欧赔：'+(x.e||'—')+'</small></p><p>赛前：'+(x.p||'未预测')+'；预测比分：'+(x.sp||'—')+'；实际：'+(x.as||'未填写')+'</p><button onclick="edit('+data.indexOf(x)+')">编辑 / 复盘</button><button onclick="del('+data.indexOf(x)+')">删除</button></div>').join('')||'<p>尚无记录</p>'}function edit(i){let x=data[i];fields.forEach(f=>$(f).value=x[f]||'');$('f').dataset.edit=i;scrollTo(0,0)}function del(i){if(confirm('删除这条记录？')){data.splice(i,1);save()}}$('f').onsubmit=e=>{e.preventDefault();let x={};fields.forEach(f=>x[f]=$(f).value.trim());let i=$('f').dataset.edit;if(i!==undefined&&i!==''){x.original=data[i].original||data[i].p;data[i]=x;delete $('f').dataset.edit}else{x.original=x.p;data.push(x)}$('f').reset();save()};$('ex').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='竞彩复盘备份.json';a.click();URL.revokeObjectURL(u)};$('im').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(Array.isArray(x)&&confirm('导入将覆盖当前记录，继续？')){data=x;save()}}catch(_){alert('备份文件格式不正确')}};render();
$('openSource').onclick=()=>window.open('https://cp.nowscore.com/buy/Jingcai.aspx?TypeID=105&OddsType=2','_blank','noopener');
$('fetchToday').onclick=async()=>{
 const btn=$('fetchToday'),status=$('fetchstatus'),out=$('fetchresults');
 btn.disabled=true;status.textContent='正在尝试读取捷报竞彩页面…';out.textContent='';
 try{
   const res=await fetch('https://cp.nowscore.com/buy/Jingcai.aspx?TypeID=105&OddsType=2',{method:'GET',mode:'cors',credentials:'omit'});
   if(!res.ok)throw new Error('捷报返回 HTTP '+res.status);
   const html=await res.text(),doc=new DOMParser().parseFromString(html,'text/html');
   const text=(doc.body?.innerText||'').trim();
   if(!text)throw new Error('页面未返回可识别文本，可能需要动态加载');
   status.textContent='页面读取成功，但正在进行保守识别；未识别字段不会当作盘口。';
   const rows=[...doc.querySelectorAll('tr')].map(x=>x.innerText.trim()).filter(x=>/\\b\\d{3}\\b/.test(x));
   out.innerHTML='<p>页面标题：'+(doc.title||'未提供')+'</p><p>疑似竞彩行：'+rows.length+' 条</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+(rows.slice(0,30).join('\\n')||text.slice(0,3000)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre><small>注意：这只是浏览器可见页面的试读，不等于已核验亚盘、水位、欧赔、凯利和大小球。</small>';
 }catch(err){
   status.textContent='浏览器直接读取失败：'+(err?.message||err)+'。常见原因是捷报未开放跨域读取。';
   out.innerHTML='<p>当前网页是静态站点，没有后台代理，因此无法绕过跨域限制。请先用“打开捷报竞彩页”确认页面可访问；要实现按钮一键抓取，需要部署后台代理。</p>';
 }finally{btn.disabled=false}
};
</script></html>
