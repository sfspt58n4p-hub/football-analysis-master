name: 手动读取捷报竞彩数据

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-nowscore:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 安装 Python 依赖
        run: python -m pip install requests beautifulsoup4
      - name: 尝试读取捷报竞彩页面
        run: python scripts/fetch_nowscore.py
      - name: 保存读取结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "没有新的数据变化"
          else
            git commit -m "Update manual nowscore data snapshot"
            git push
          fi
